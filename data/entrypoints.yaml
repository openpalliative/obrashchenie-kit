    title: Не ответили в срок
    summary: Посчитать срок ответа и пожаловаться, если он прошёл
    path: scenarios/no-answer/
    audience: [family]
    situations: [refused]
    offline: "true"
    printable: "false"
    maturity: demo
    verified: "false"
    verified_at: ""
  - id: case
    title: Моё дело
    summary: Документы, сроки и следующий шаг. Хранится только на вашем устройстве
    path: case/
    audience: [family]
    situations: [refused, discharge, conclusion]
    offline: "true"
    printable: "true"
    maturity: demo
    verified: "false"
    verified_at: ""
  - id: answer
    title: Что пришло в ответ
    summary: Выберите, что вам ответили, и посмотрите варианты следующего шага
    path: answer/
    audience: [family]
    situations: [refused]
    offline: "true"
    printable: "false"
    maturity: demo
    verified: "false"
    verified_at: ""
  - id: call
    title: Отказали по телефону или при визите
    summary: Лист, чтобы записать разговор, пока вы его помните
    path: call/
    audience: [family]
    situations: [refused, night-pain, emergency-sheet]
    offline: "true"
    printable: "true"
    maturity: demo
    verified: "false"
    verified_at: ""
  - id: turning-18
    title: Ребёнку скоро 18
    summary: До какой даты выписка ребёнка должна уйти во взрослую поликлинику
    path: turning-18/
    audience: [family]
    situations: [turning-18, emergency-sheet]
    offline: "true"
    printable: "true"
    maturity: demo
    verified: "false"
    verified_at: ""
