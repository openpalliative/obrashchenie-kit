entrypoints:
  - id: oral-refusal
    title: Отказали на словах
    summary: Как попросить ответ на бумаге и не пропустить срок
    path: scenarios/oral-refusal/
    audience: [family]
    situations: [refused, device, dying]
    offline: "true"
    printable: "false"
    maturity: demo
    verified: "false"
    verified_at: ""
  - id: vk-refused
    title: Не созывают врачебную комиссию или отказали в заключении
    summary: Попросить комиссию письменно и получить её решение на руки
    path: scenarios/vk-refused/
    audience: [family]
    situations: [conclusion]
    offline: "true"
    printable: "false"
    maturity: demo
    verified: "false"
    verified_at: ""
  - id: discharge
    title: Выписывают домой
    summary: Какие документы запросить до выхода из больницы
    path: scenarios/discharge/
    audience: [family]
    situations: [discharge]
    offline: "true"
    printable: "false"
    maturity: demo
    verified: "false"
    verified_at: ""
  - id: forwarded
    title: Жалобу переслали тому, на кого вы жалуетесь
    summary: Повторная жалоба выше с просьбой не пересылать её
    path: scenarios/forwarded/
    audience: [family]
    situations: [refused]
    offline: "true"
    printable: "false"
    maturity: demo
    verified: "false"
    verified_at: ""
