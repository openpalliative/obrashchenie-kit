name: Ошибка в документе
description: В заявлении, жалобе или запросе неверная норма, адресат, срок или непонятная фраза
title: "Ошибка в документе: "
labels: ["review:legal"]
body:
  - type: markdown
    attributes:
      value: |
        **Это сообщение увидят все. Не пишите ФИО, диагнозы, адреса, телефоны и номера документов.**

        Не прикладывайте настоящие заявления, жалобы, ответы, выписки и их фото, даже свои и даже с закрашенными данными. Нам достаточно названия документа, места в тексте и того, как правильно
  - type: dropdown
    id: document
    attributes:
      label: Какой документ
      options:
        - Попросить письменный ответ вместо устного отказа
        - Запросить выписку из протокола врачебной комиссии
        - Запросить копии медицинских документов и выписки
        - Пожаловаться, что не ответили в срок
        - Повторная жалоба
        - Опись документов и отметка о приёме
        - Не знаю или другое место на сайте
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Адрес страницы
      description: Скопируйте из строки браузера. Если в адресе после знака # есть что-то, удалите эту часть
      placeholder: https://openpalliative.github.io/obrashchenie-kit/docs/...
    validations:
      required: false
  - type: textarea
    id: quote
    attributes:
      label: Как написано у нас
      description: Скопируйте фразу из шаблона, без своих данных из полей
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Что не так и как правильно
      description: Своими словами. Если дело в норме или сроке, напишите, на что опираетесь
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Ссылка на официальную публикацию
      description: Если ошибка в норме, сроке или адресате. Например, публикация на publication.pravo.gov.ru и номер страницы
    validations:
      required: false
  - type: dropdown
    id: who
    attributes:
      label: Кто вы
      description: Необязательно. Помогает понять, как читать замечание
      options:
        - Юрист
        - Работаю в НКО или хосписе
        - Родственник или ухаживающий
        - Другое
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: В сообщении нет ФИО, диагнозов, адресов, телефонов и номеров документов
          required: true
        - label: Я не прикладываю настоящие документы, их фото и сканы
          required: true
