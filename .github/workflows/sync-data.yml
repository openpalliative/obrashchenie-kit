name: sync-data
on:
  schedule: [{ cron: "43 5 * * 2" }]
  workflow_dispatch:
permissions: {}
concurrency: { group: sync-data, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: write, pull-requests: write, issues: write, actions: write }
    env: { OK_VENDOR: real }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.11.7", enable-cache: false }
      - run: uv sync --frozen
      - run: mkdir -p _reports
      - run: uv run python -m opsite sync-data --from pages
      - id: build
        continue-on-error: true
        run: |
          uv run python -m opsite build
          uv run python -m opsite check --ci
      - name: report
        env:
          BUILD_OK: ${{ steps.build.outcome == 'success' }}
        run: uv run python -m pipeline.sync_report --build-ok "$BUILD_OK"
      - id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "labels=$(jq -r '.labels | join(",")' _reports/sync.json)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- vendor deps.yaml)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: upstream
        if: steps.meta.outputs.changed == 'true'
        run: uv run python -m pipeline.upstream
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/${{ steps.meta.outputs.date }}
          title: "data: снимки соседей ${{ steps.meta.outputs.date }}"
          commit-message: "data: снимки соседей ${{ steps.meta.outputs.date }}"
          body: "Новые снимки pal-norms и pal-directory. Сборка: ${{ steps.build.outcome }}. Проверьте, что документы собираются и даты ответа не сдвинулись без причины. Подробности в _reports/sync.json артефакта sync-reports"
          labels: ${{ steps.meta.outputs.labels }}
          add-paths: |
            vendor/**
            deps.yaml
            data/snapshots/upstream.json
      - name: checks on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run checks.yml --ref "$BRANCH"
      - name: issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run python -m pipeline.issues _reports/sync.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sync-reports, path: _reports, if-no-files-found: ignore }
      - name: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-data.yml/enable"
  review-due:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "0.11.7", enable-cache: false }
      - run: uv sync --frozen
      - id: when
        run: if [ "$(date -u +%d)" -le 7 ]; then echo "monthly=true" >> "$GITHUB_OUTPUT"; else echo "monthly=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.when.outputs.monthly == 'true' || github.event_name == 'workflow_dispatch'
        run: uv run python -m pipeline.review_due
      - if: steps.when.outputs.monthly == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run python -m pipeline.issues _reports/review.json
