title: Лист разговора
lead: Сразу запишите на бумаге, что вам сказали, пока помните. С этим листом проще попросить ответ письменно
fields:
  - id: where
    label: Куда звонили или кто приходил
    hint: Например, регистратура поликлиники, участковый врач, отделение больницы, скорая помощь, выездная паллиативная служба
    lines: "2"
  - id: who
    label: Кто ответил
    hint: Должность, а если назвали, то фамилия
    lines: "2"
  - id: said
    label: Что сказали
    hint: Как можно ближе к словам. Например, «аппарат не положен», «комиссию не собираем», «к вам не поедем»
    lines: "5"
  - id: asked
    label: О чём вы просили
    hint: Коротко, своими словами
    lines: "3"
tips:
  - Спросите, как зовут собеседника и какая у него должность
  - Попросите ответить письменно. Если отказываются, это тоже запишите
  - Запишите на бумаге, что вам сказали, сразу после разговора, пока помните точные слова
  - Не пишите здесь диагноз, он не нужен
